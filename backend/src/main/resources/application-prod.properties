# ============================================================
# application-prod.properties – T193-G2.2-A
# Profile "prod": ghi de cac thuoc tinh co fallback dev khong an toan.
# Duoc kich hoat qua: SPRING_PROFILES_ACTIVE=prod (inject boi docker-compose.prod.yml)
# ============================================================

# R-02b: JWT_SECRET production khong duoc co fallback dev.
# Neu bien moi truong JWT_SECRET bi thieu hoac ngan hon 32 ky tu,
# @Size(min=32) trong JwtProperties se nem BindException khi khoi dong -> fail-fast.
app.jwt.secret=${JWT_SECRET}

# R-02a: ADMIN_PASSWORD production khong duoc co fallback Admin@123.
# Neu bien moi truong ADMIN_PASSWORD bi thieu,
# @NotBlank trong AdminProperties se nem BindException -> fail-fast.
app.admin.password=${ADMIN_PASSWORD}

# Production khong bao gio seed du lieu mau
app.seed.sample-data=false
