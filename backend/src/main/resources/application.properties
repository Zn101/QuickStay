spring.application.name=quickstay
server.port=8080

# Mac dinh chay H2 in-memory (dev). Docker/prod dat DB_URL de dung MySQL.
spring.datasource.url=${DB_URL:jdbc:h2:mem:quickstay;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Luoc do do Flyway quan ly (src/main/resources/db/migration); Hibernate chi kiem tra khop entity
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

# JWT: JWT_SECRET toi thieu 32 ky tu, app khong khoi dong neu ngan hon
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
app.jwt.expiration=${JWT_EXPIRATION:24h}

# CORS: chi cho phep nguon Frontend (cach nhau bang dau phay)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:8081}

# Tai khoan admin mac dinh (tao khi chua co)
app.admin.email=${ADMIN_EMAIL:admin@quickstay.local}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

# Mui gio nghiep vu: "hom nay" khi kiem tra ngay nhan phong (khong theo gio may chu)
app.timezone=${APP_TIMEZONE:Asia/Ho_Chi_Minh}

# Du lieu mau 4 khach san (tao khi bang hotels trong); dat false tren moi truong that
app.seed.sample-data=${SEED_SAMPLE_DATA:true}

management.endpoints.web.exposure.include=health,info
logging.level.com.quickstay=INFO

server.error.include-message=always

# So thap phan gui vao truong so nguyen (vd. guests: 2.5, roomId: 1.5) bao loi 400 thay vi bi lam tron am tham
spring.jackson.deserialization.accept-float-as-int=false

# Email (SMTP that neu dat MAIL_HOST; bo trong thi chay che do mo phong & luu vao email_logs)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
management.health.mail.enabled=false
app.mail.from=${MAIL_FROM:no-reply@quickstay.io.vn}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# AI Assistant (Anthropic API hoac fallback dua tren CSDL khi de trong key)
app.ai.api-key=${ANTHROPIC_API_KEY:}
app.ai.model=${ANTHROPIC_MODEL:claude-sonnet-4-20250514}
app.ai.base-url=${ANTHROPIC_BASE_URL:https://api.anthropic.com}
app.ai.timeout-seconds=20
