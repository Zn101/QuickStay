services:
  mysql:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: quickstay
      MYSQL_USER: quickstay
      MYSQL_PASSWORD: ${DB_PASSWORD:-quickstay_pw}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pw}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root_pw}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/quickstay?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_USER: quickstay
      DB_PASSWORD: ${DB_PASSWORD:-quickstay_pw}
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@quickstay.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8081}:80"

volumes:
  mysql-data:
