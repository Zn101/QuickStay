name: CI — Frontend

# ──────────────────────────────────────────────────────────────────────────────
# Trigger: push / PR vào main hoặc develop, chỉ khi có thay đổi ở frontend
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Node 20)
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout source code
        uses: actions/checkout@v4

      # ── 2. Cài Node.js 20 (LTS) ──────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # ── 3. Cài dependencies ───────────────────────────────────────────────────
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # ── 4. Chạy test (Vitest) ─────────────────────────────────────────────────
      - name: Run tests
        working-directory: frontend
        run: npm test

      # ── 5. Build production bundle (xác nhận không có lỗi compile) ───────────
      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      # ── 6. Upload dist artifact (tuỳ chọn, hữu ích khi cần preview) ──────────
      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.run_number }}
          path: frontend/dist/
          retention-days: 3

      # ── 7. Tóm tắt ───────────────────────────────────────────────────────────
      - name: Summarize
        if: always()
        run: |
          echo "## Frontend Build & Test" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| npm test  | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| npm build | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
