name: CI — Frontend

# ──────────────────────────────────────────────────────────────────────────────
# Trigger: push / PR vào các nhánh tích hợp chính và nhánh dev-minh
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, develop, dev, dev-minh]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    branches: [main, develop, dev]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Node 20)
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout source code
        uses: actions/checkout@v4

      # ── 2. Cài Node.js 20 (LTS) ──────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # ── 3. Cài dependencies (dùng lock file, đảm bảo reproducible) ───────────
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # ── 4. Chạy test (Vitest — môi trường jsdom) ──────────────────────────────
      - name: Run tests
        id: run-tests
        working-directory: frontend
        run: npm test

      # ── 5. Build production bundle (xác nhận không có lỗi compile) ───────────
      - name: Build production bundle
        id: run-build
        working-directory: frontend
        run: npm run build

      # ── 6. Upload dist artifact (hữu ích để preview build trên mọi nhánh dev) ─
      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.ref_name }}-${{ github.run_number }}
          path: frontend/dist/
          retention-days: 3

      # ── 7. Tóm tắt ───────────────────────────────────────────────────────────
      - name: Summarize
        if: always()
        run: |
          echo "## Frontend CI — Build & Test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step       | Kết quả |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| npm test   | ${{ steps.run-tests.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| npm build  | ${{ steps.run-build.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\` — **Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
