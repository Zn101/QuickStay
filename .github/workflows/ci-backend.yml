name: CI — Backend

# ──────────────────────────────────────────────────────────────────────────────
# Trigger: mọi push và pull request vào nhánh main / develop
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

# Huỷ run cũ khi có push mới trên cùng PR (tiết kiệm phút CI)
concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Java 17)
    runs-on: ubuntu-latest

    # Biến môi trường dùng H2 in-memory — không cần MySQL thật khi test
    env:
      SPRING_DATASOURCE_URL:      jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.H2Dialect
      JWT_SECRET: test-secret-test-secret-test-secret-test-secret

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout source code
        uses: actions/checkout@v4

      # ── 2. Cài Java 17 (Temurin, khớp với Dockerfile và build.gradle) ────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          # Cache Maven local repo của Gradle để tái sử dụng giữa các run
          cache: gradle

      # ── 3. Phân quyền Gradle wrapper ─────────────────────────────────────────
      - name: Grant execute permission to Gradle wrapper
        working-directory: backend
        run: chmod +x gradlew

      # ── 4. Cache Gradle wrapper và dependencies ───────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('backend/build.gradle', 'backend/settings.gradle', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 5. Build và chạy toàn bộ test ────────────────────────────────────────
      - name: Build & run tests
        working-directory: backend
        run: ./gradlew build --no-daemon

      # ── 6. Upload báo cáo test (có thể xem ngay trên tab Artifacts) ──────────
      - name: Upload test report
        if: always()          # upload dù pass hay fail để debug
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report-${{ github.run_number }}
          path: backend/build/reports/tests/test/
          retention-days: 7

      # ── 7. Tóm tắt kết quả test lên GitHub Summary ───────────────────────────
      - name: Summarize test results
        if: always()
        run: |
          echo "## Backend Test Results" >> $GITHUB_STEP_SUMMARY
          if [ -f backend/build/reports/tests/test/index.html ]; then
            TOTAL=$(grep -oP '(?<=Tests run: )\d+' backend/build/test-results/test/*.xml 2>/dev/null | paste -sd+ | bc || echo "N/A")
            FAILED=$(grep -oP '(?<=failures=")\d+' backend/build/test-results/test/*.xml 2>/dev/null | paste -sd+ | bc || echo "0")
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total  | $TOTAL |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          else
            echo "Test report not found." >> $GITHUB_STEP_SUMMARY
          fi
