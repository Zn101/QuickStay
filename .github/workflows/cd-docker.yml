# ============================================================
# QuickStay – CD: Build & Push Docker Images to GHCR (T121)
# ============================================================
# Trigger: push vao nhanh main (merge PR)
# Output: ghcr.io/zn101/quickstay-backend:<tag>
#         ghcr.io/zn101/quickstay-frontend:<tag>
# Tag: sha-<short-commit> + latest
# ============================================================

name: CD – Build & Push to GHCR

on:
  push:
    branches:
      - main

# Quyen toi thieu: doc source, ghi package len GHCR
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cau hinh Docker Buildx (ho tro cache va multi-platform neu can)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Dang nhap GHCR bang GITHUB_TOKEN (khong can PAT)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── BACKEND ───────────────────────────────────────────────

      # 4a. Tao tag va label cho backend image
      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/zn101/quickstay-backend
          flavor: |
            latest=true
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # 4b. Build va push backend image
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # ── FRONTEND ──────────────────────────────────────────────

      # 5a. Tao tag va label cho frontend image
      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/zn101/quickstay-frontend
          flavor: |
            latest=true
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # 5b. Build va push frontend image
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # 6. In tom tat ket qua
      - name: Summary
        run: |
          echo "## Docker Images pushed to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Backend" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta-backend.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta-frontend.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
      # 7. Deploy to VPS after both images are pushed
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "$VPS_SSH_KEY" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -t rsa "$VPS_HOST" > ~/.ssh/known_hosts

          ssh-keygen -lf ~/.ssh/known_hosts | grep -F "SHA256:fC0vLYUEKoEyoQsLPjKfSwCm1N9fN5g08MRUyKgAgQM"

          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -e
          cd /opt/quickstay

          echo "Pulling latest QuickStay images..."
          docker compose pull backend frontend

          echo "Restarting backend and frontend..."
          docker compose up -d --no-build --no-deps backend frontend

          echo "Waiting for backend health..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Backend is healthy."
              curl -fsSI http://localhost
              exit 0
            fi
            sleep 2
          done

          echo "Backend health check failed."
          docker compose logs --tail=100 backend
          exit 1
          REMOTE
